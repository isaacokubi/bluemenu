name: BlueMenu billing and Daraja reconciliation
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server dependencies
        run: npm install -w server
      - name: Reconcile pending payments and subscription periods
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          DARAJA_RECONCILE_SECRET: ${{ secrets.DARAJA_RECONCILE_SECRET }}
          BILLING_RECONCILE_SECRET: ${{ secrets.BILLING_RECONCILE_SECRET }}
        run: npm run reconcile -w server
